<!-- Source for kofi-avatar.png — the profile picture on ko-fi.com/pocketge.
     Regenerate after editing:
       npx playwright screenshot --viewport-size=800,800 kofi-avatar.source.html kofi-avatar.png

     Square, because Ko-fi crops avatars to a circle: the blade sits well
     inside the inscribed circle and the corners carry nothing.

     The scimitar is the logo, so the scimitar is the avatar. Source is
     images/12389.png — the full-resolution item art already in this repo at
     1287x1469, NOT favicon.png (36x32, nothing to scale up from) and not the
     wiki's copy (a remote fetch that would have to resolve at screenshot
     time). Gold on near-black rather than the gold disc used for the GE
     tile: the blade is itself gold, so it needs the dark ground to read. -->
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:800px; height:800px; }
  body {
    background:
      radial-gradient(420px 420px at 50% 46%, rgba(255,179,0,0.20), transparent 68%),
      radial-gradient(760px 760px at 50% 50%, #17130C, #0A0908 72%);
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  /* Rotated so the blade runs corner to corner of the circle rather than
     leaving the left and right thirds empty — the item art is drawn on a
     diagonal already, this only squares it up with the crop. */
  .stack { display:flex; flex-direction:column; align-items:center; gap:4px; }
  /* 330px, not larger. The art is 1287x1469 on a diagonal, so its corners
     reach further than the width suggests: at 620px the tip and hilt were
     both clipped by the square, before Ko-fi's circle had taken anything.
     This leaves room for the wordmark and keeps both inside the inscribed
     circle with margin. */
  img {
    width:330px; height:auto; display:block;
    /* translate BEFORE rotate: the art carries empty space down its left
       side, so a bounding-box centre leaves the blade sitting optically
       right of the wordmark under it. */
    transform: translateX(-16px) rotate(-10deg);
    filter: drop-shadow(0 0 30px rgba(255,179,0,.38)) drop-shadow(0 6px 14px rgba(0,0,0,.55));
  }
  /* Same wordmark as og-image.source.html: cream "Pocket", gold "GE". */
  .word {
    font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
    font-size:86px; font-weight:700; letter-spacing:-2.5px; line-height:1;
    color:#F4F1E8; text-shadow:0 3px 10px rgba(0,0,0,.6);
  }
  .word b { color:#FFB300; font-weight:700; }
</style>

<div class="stack">
  <img src="/images/12389.png" alt="Gilded scimitar">
  <div class="word">Pocket<b>GE</b></div>
</div>
