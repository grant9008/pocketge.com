# Keeps the ?v= content hash on every CSS/JS URL in step with the files.
#
# Without it a deploy is invisible to anyone whose browser is still holding the
# old bundle. GitHub Pages sends Cache-Control: max-age=600 on these, and iOS
# holds them well past that in practice — the failure mode is a change that is
# demonstrably live on main and demonstrably absent on the phone, with nothing
# on either side saying why.
#
# Why a workflow and not the weekly prerender: prerender runs on Sundays, and a
# stylesheet pushed on Monday would spend six days deployed under a URL nobody
# is asked to re-fetch. This fires on the push that changes the asset.
name: Stamp asset URLs

on:
  push:
    branches: [main]
    # ONLY the assets. This job's own commit touches HTML and nothing else, so
    # it cannot retrigger itself — that is the whole loop guard, and it is why
    # no *.html belongs in this list.
    paths:
      - 'app.css'
      - 'app.js'
      - 'flip-group.js'
      - 'bridge-port.js'
      - 'site-nav.js'
      - 'flip-history.js'
      - 'item-pages.js'
      - 'finder-page.css'
      - 'stamp_assets.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A burst of pushes should settle on one stamping run against the final
  # state, not queue one per push racing each other to commit.
  group: stamp-assets
  cancel-in-progress: true

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp
        run: python3 stamp_assets.py

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '*.html'
          if git diff --cached --quiet; then
            echo "stamps already current"
            exit 0
          fi
          git commit -m "Stamp asset URLs" \
                     -m "Generated by .github/workflows/stamp-assets.yml. The ?v= hash is of each file's own bytes, so a browser holding the previous version cannot serve it for the new URL."
          git push
