# Builds the per-item static pages and commits them.
#
# This runs here rather than on anyone's machine for two reasons: nobody
# should need a Python toolchain and a clone to publish a page, and the
# generator needs to reach prices.runescape.wiki, which sandboxed
# environments commonly block. A GitHub runner has both.
#
# Output is committed straight to the default branch because GitHub Pages
# serves this repo as-is — an uncommitted page is not a published page.
name: Prerender item pages

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many items to prerender, ranked by daily volume'
        required: false
        default: '800'
  # Weekly. This was monthly, on the grounds that each run rewrites every
  # generated page and so costs "~34MB of changed files" — but that is the
  # working-tree diff, not what git stores. Measured with
  # `git rev-list --disk-usage`, a run actually costs 1.3–1.4MB: the pages are
  # near-identical, so they delta-compress to almost nothing. Monthly was
  # buying ~17MB/yr over weekly's ~73MB/yr, on a 197MB pack.
  #
  # What monthly cost instead: the price quoted in each page's meta
  # description is what shows in the search result, and it was up to 30 days
  # stale there. It also meant any change to how pages are GENERATED sat
  # dormant until the 1st — the 2026-09-15 run shipped three merged PRs'
  # worth of page changes that had been live in the repo but not on the site.
  #
  # Not daily: ~510MB/yr, for a snapshot the app replaces with live prices the
  # moment it loads. Sunday, so a fresh set goes into the week.
  schedule:
    - cron: '17 4 * * 0'

permissions:
  contents: write

concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Fetched as its own step so a network failure reads as "the price API
      # was unreachable" rather than surfacing halfway through a render.
      - name: Fetch price snapshot
        run: |
          set -euo pipefail
          curl -sS --fail --retry 3 --retry-delay 5 --max-time 60 \
            -A "pocketge.com prerender (github actions)" \
            https://prices.runescape.wiki/api/v1/osrs/latest  -o /tmp/latest.json
          curl -sS --fail --retry 3 --retry-delay 5 --max-time 60 \
            -A "pocketge.com prerender (github actions)" \
            https://prices.runescape.wiki/api/v1/osrs/volumes -o /tmp/volumes.json
          # The item universe. items-json is a 2021 osrsbox archive whose newer
          # entries are name-only skeletons, so anything released since could
          # never be prerendered; this is the same list app.js searches.
          curl -sS --fail --retry 3 --retry-delay 5 --max-time 60 \
            -A "pocketge.com prerender (github actions)" \
            https://prices.runescape.wiki/api/v1/osrs/mapping -o /tmp/mapping.json
          # One bulk call for every item, NOT /timeseries per item: that would
          # be ~1,700 requests a run against a volunteer-run API for a range
          # the app already fetches on demand for real visitors.
          curl -sS --fail --retry 3 --retry-delay 5 --max-time 60 \
            -A "pocketge.com prerender (github actions)" \
            https://prices.runescape.wiki/api/v1/osrs/24h -o /tmp/24h.json
          python3 - <<'PY'
          import json, datetime
          snap = {"latest": json.load(open('/tmp/latest.json'))["data"],
                  "volumes": json.load(open('/tmp/volumes.json'))["data"],
                  "mapping": json.load(open('/tmp/mapping.json')),
                  "day": json.load(open('/tmp/24h.json'))["data"],
                  "fetched": datetime.date.today().isoformat()}
          assert len(snap["mapping"]) > 3000, f"mapping looks truncated: {len(snap['mapping'])}"
          json.dump(snap, open('/tmp/snapshot.json', 'w'))
          print(f"{len(snap['latest']):,} priced items, {len(snap['volumes']):,} with volume, "
                f"{len(snap['mapping']):,} in the mapping, "
                f"{len(snap['day']):,} with 24h averages")
          PY

      - name: Generate pages and sitemap
        run: |
          set -euo pipefail
          python3 prerender_items.py --limit "${{ github.event.inputs.limit || '800' }}" \
                                     --snapshot /tmp/snapshot.json
          # Before the sitemap, so a glossary edit in index.html reaches
          # glossary.html in the same run that lists it.
          python3 generate_glossary.py
          # After prerender (it reads item-pages.js) and before the sitemap
          # (which globs *.html, so items.html has to exist to be listed).
          python3 generate_item_index.py --snapshot /tmp/snapshot.json
          python3 generate_sitemap.py --snapshot /tmp/snapshot.json

      # A page that names the wrong item, or an empty summary, is worse than
      # no page — fail the run rather than commit it.
      - name: Sanity-check the output
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, sys, pathlib
          pages = json.loads(re.search(r"=\s*(\[.*\])\s*;",
                    pathlib.Path('item-pages.js').read_text(), re.S).group(1))
          assert pages, "item-pages.js is empty — nothing was generated"
          files = list(pathlib.Path('item').rglob('index.html'))
          assert len(files) == len(pages), f"{len(files)} pages vs {len(pages)} listed"
          bad = []
          for f in files:
              s = f.read_text()
              slug = f.parent.name
              t = re.search(r"<title>(.*?)</title>", s, re.S)
              summ = re.search(r'id="isSummary">(.*?)</p>', s, re.S)
              canon = re.search(r'<link rel="canonical" href="([^"]*)"', s)
              h1 = re.search(r'id="seoH1">(.*?) price in OSRS', s, re.S)
              # The h1 is sr-only, so #tickerName is the first VISIBLE heading.
              # It shipped as the literal "Loading..." on all 1,829 pages once;
              # if the template edit ever stops matching, say so here rather
              # than commit that again.
              tick = re.search(r'<h2 id="tickerName">(.*?)</h2>', s, re.S)
              # The summary is judged on what it SAYS, not how long it is. A
              # 60-character floor was standing in for that, and it failed four
              # honest pages (Vial, Cod, Flax, Jug) the moment the copy got
              # shorter: a three-letter name and a two-digit price is a
              # perfectly good summary. Name plus price is the real property.
              txt = re.sub(r"<[^>]+>", "", summ.group(1)) if summ else ""
              if not t or "Price OSRS" not in t.group(1): bad.append(f"{slug}: title")
              elif not h1: bad.append(f"{slug}: h1")
              elif not txt.startswith(h1.group(1) + " "): bad.append(f"{slug}: summary names {txt[:40]!r}")
              elif "gp on the OSRS GE" not in txt: bad.append(f"{slug}: summary quotes no price")
              elif not canon or not canon.group(1).endswith(f"/item/{slug}/"): bad.append(f"{slug}: canonical")
              elif not tick or tick.group(1).strip() != h1.group(1): bad.append(
                  f"{slug}: ticker heading {(tick.group(1).strip() if tick else None)!r}")
          if bad:
              print("\n".join(bad[:20])); sys.exit(f"{len(bad)} bad pages")
          size = sum(f.stat().st_size for f in files)
          print(f"{len(files):,} pages, {size/1e6:.1f} MB, all with title/summary/canonical")

          # The long form is the whole reason these pages can be indexed at all
          # -- before it, a page carried 59 unique words against ~1,594 of app
          # shell, which is what "Crawled - currently not indexed" is. If it
          # ever silently renders empty (a mapping with no examine/limit/alch,
          # a template edit that stops matching) the run must say so rather than
          # commit 1,700 thin pages again.
          #
          # A floor of 60, not one calibrated to the ~280 words it writes today:
          # a 60-character summary floor once failed four perfectly honest pages
          # the moment the copy got shorter. This is here to catch EMPTY, not
          # short.
          lens = []
          for f in files:
              d = re.search(r'<div class="is-detail"[^>]*>(.*?)</div>\n', f.read_text(), re.S)
              lens.append(len(re.sub(r"<[^>]+>", " ", d.group(1)).split()) if d else 0)
          thin = [f.parent.name for f, n in zip(files, lens) if n < 60]
          assert not thin, f"{len(thin)} pages with no usable long form: {sorted(thin)[:10]}"
          print(f"long form on every page — {min(lens)} words at the shortest, "
                f"{sum(lens)//len(lens)} on average")
          # every related link must point at a page that exists
          slugs = {f.parent.name for f in files}
          dangling = {h for f in files for h in re.findall(r'href="/item/([^/"]+)/"', f.read_text())} - slugs
          assert not dangling, f"related links to missing pages: {sorted(dangling)[:10]}"
          print("no related link points at a missing page")

          # The glossary is 12.5KB of prose identical on every page — 22.9MB
          # across the set — and none of it is about the item. Item pages carry
          # a stub and fetch /glossary.html on first Help open, so if the strip
          # ever stops matching, say so rather than ship the bulk again.
          gloss = pathlib.Path('glossary.html')
          assert gloss.exists(), "glossary.html missing — run generate_glossary.py"
          assert gloss.read_text().count('glossary-row') >= 10, "glossary.html has no rows"
          fat = [f.parent.name for f in files if 'glossary-row' in f.read_text()]
          assert not fat, f"{len(fat)} item pages still inline the glossary: {sorted(fat)[:10]}"
          stubless = [f.parent.name for f in files if 'data-glossary-src' not in f.read_text()]
          assert not stubless, f"{len(stubless)} item pages have no glossary stub: {sorted(stubless)[:10]}"
          print(f"glossary stripped from all {len(files):,} item pages, stub on every one")

          # Hand-written item links on the static pages. prerender_items.py
          # rewrites /?q=Name to /item/<slug>/ as soon as a page exists, which
          # means those links now 404 rather than degrade if a page ever stops
          # being generated. An item link the site makes itself must resolve.
          # (slugs is the published set, built for the related-link check above.)
          for name in ('index.html', 'flipping-guide.html'):
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              broken = set(re.findall(r'href="/item/([^/"]+)/"', p.read_text())) - slugs
              assert not broken, f"{name} links to missing item pages: {sorted(broken)[:10]}"
          print("every hand-written /item/ link resolves")

          # The A-Z index is what gives every item page an inbound link: 706 of
          # them had none, because related_html() sorts by volume and takes the
          # top four, so the busiest items absorbed every link. If the index
          # ever falls behind the generated set, those pages are orphaned again
          # with nothing to say so.
          idx = pathlib.Path('items.html')
          assert idx.exists(), "items.html missing — run generate_item_index.py"
          listed = set(re.findall(r'href="/item/([^/"]+)/"', idx.read_text()))
          assert not (slugs - listed), \
              f"{len(slugs - listed)} item pages not in the A-Z index: {sorted(slugs - listed)[:10]}"
          assert not (listed - slugs), \
              f"A-Z index links {len(listed - slugs)} pages that do not exist: {sorted(listed - slugs)[:10]}"
          print(f"A-Z index links all {len(slugs):,} item pages — none orphaned")

          # The pinned categories are the whole point of pinning: if one stops
          # matching -- a rename, a regex edit -- the set silently reverts to
          # "top N by volume" and nobody notices until someone searches for a
          # teleport tablet. Every pinned item that HAS a price must have a page.
          sys.path.insert(0, '.')
          import prerender_items as P
          snap = json.load(open('/tmp/snapshot.json'))
          have = {n.lower() for n in pages}
          want = [it["name"] for it in P.ge_items(snap.get("mapping"))
                  if P.is_pinned(it["name"])
                  and (snap["latest"].get(str(it["id"])) or {}).get("high")]
          missing = [n for n in want if n.lower() not in have]
          # a slug collision is a legitimate reason to be absent; anything else is not
          taken = {}
          for n in want:
              taken.setdefault(P.slugify(n), []).append(n)
          excused = {n for v in taken.values() if len(v) > 1 for n in v[1:]}
          real = [n for n in missing if n not in excused]
          print(f"{len(want):,} pinned items priced, {len(want) - len(missing):,} with pages")
          assert not real, f"pinned items with no page: {sorted(real)[:15]}"

          # A pin only produces a page if the item is in the mapping AND has a
          # live price, and the assertion above deliberately excuses the rest --
          # otherwise a quiet item would fail the build. That silence is how
          # bonds went unnoticed, so the run says out loud which pins produced
          # nothing and why. Reported, not fatal.
          allp = {it["name"] for it in P.ge_items(snap.get("mapping")) if P.is_pinned(it["name"])}
          unpriced = sorted(allp - set(want))
          if unpriced:
              print(f"{len(unpriced)} pinned items had no live price, so no page: "
                    + ", ".join(unpriced[:12]) + (" ..." if len(unpriced) > 12 else ""))
          PY

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # glossary.html is generated from index.html's Help modal, and
          # index.html / flipping-guide.html get their /?q= item links
          # rewritten to /item/<slug>/ as soon as a page exists. Both are
          # outputs of this run: staging only item/ silently threw them away.
          git add item item-pages.js sitemap.xml glossary.html items.html index.html flipping-guide.html
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Prerender item pages ($(date -u +%Y-%m-%d))" \
                     -m "Generated by .github/workflows/prerender.yml. Prices are a snapshot; the app refreshes them live on load."
          git push
